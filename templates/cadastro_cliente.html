{% extends "base.html" %}

{% block title %}Cadastrar Cliente — R-Mobile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="card-title h3 mb-0">Cadastrar Novo Cliente</h2>
                    <a href="/clientes" class="btn btn-sm btn-outline-secondary">← Voltar</a>
                </div>
                <form action="/clientes/cadastrar" method="POST">
                    <div class="row g-3 mb-3">
                        <div class="col-md-5">
                            <label for="id" class="form-label fw-semibold">ID do Cliente (5 dígitos)</label>
                            <input type="number" class="form-control font-monospace" id="id" name="id"
                                   required min="10000" max="99999" placeholder="Ex: 58372">
                            <div class="form-text">Chave inteira utilizada na Árvore B.</div>
                        </div>
                        <div class="col-md-7">
                            <label for="esim" class="form-label fw-semibold">Código eSIM</label>
                            <input type="text" class="form-control font-monospace text-uppercase" id="esim" name="esim"
                                   required placeholder="Ex: ESIM-46458">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="nome" class="form-label fw-semibold">Nome Completo</label>
                        <input type="text" class="form-control" id="nome" name="nome" required placeholder="Ex: Maria Oliveira">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="Ex: maria.oliveira@email.com">
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-7">
                            <label for="pacote" class="form-label fw-semibold">Pacote Contratado</label>
                            <select class="form-select" id="pacote" name="pacote" required>
                                <option value="" selected disabled>Selecione um pacote...</option>
                                {% if pacotes %}
                                    {% for p in pacotes %}
                                    <option value="{{ p.codigo }}">{{ p.codigo }} — {{ p.nome }} ({{ p.dados }} / {{ p.validade }})</option>
                                    {% endfor %}
                                {% else %}
                                    <option value="101">101 — Europa Basic (5 GB / 15 dias)</option>
                                    <option value="102">102 — Europa Plus (10 GB / 30 dias)</option>
                                    <option value="201">201 — América Basic (5 GB / 15 dias)</option>
                                    <option value="202">202 — América Plus (15 GB / 30 dias)</option>
                                    <option value="301">301 — Global (20 GB / 30 dias)</option>
                                {% endif %}
                            </select>
                        </div>
                        <div class="col-md-5">
                            <label for="status" class="form-label fw-semibold">Status do eSIM</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="ativo" selected>Ativo</option>
                                <option value="inativo">Inativo</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">Cadastrar Cliente</button>
                        <a href="/clientes" class="btn btn-outline-secondary px-3">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
